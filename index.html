<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Календарь — Атриум</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <div class="page">
    <div class="calendar">
      <div class="filters">
        <div class="filters-left">
          <div class="nav-buttons">
            <button class="icon-btn" type="button" id="prev-week" aria-label="Предыдущая неделя">
              <img src="assets/chevron-left.svg" alt="" />
            </button>
            <button class="icon-btn" type="button" id="next-week" aria-label="Следующая неделя">
              <img src="assets/chevron-right.svg" alt="" />
            </button>
          </div>
          <h1 class="title" id="week-title"></h1>
        </div>
        <div class="segment" id="segment">
          <button class="seg-item active" type="button">Все типы</button>
          <button class="seg-item" type="button">Занятия</button>
          <button class="seg-item" type="button">Домашние задания</button>
        </div>
        <button class="courses-btn" type="button">
          <span>Все курсы</span>
          <img src="assets/chevron-down.svg" alt="" />
        </button>
      </div>

      <div class="grid-scroll" id="grid-scroll">
        <div class="grid" id="grid"></div>
      </div>
    </div>

    <footer class="footer">
      <img src="assets/logo.svg" alt="Атриум" />
    </footer>
  </div>

  <button class="help-btn" type="button" aria-label="Помощь">
    <img src="assets/question.svg" alt="" />
  </button>

  <script src="script.js?v=3"></script>
</body>
</html>
